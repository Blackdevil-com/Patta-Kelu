# Local Datasource (H2 embedded file with PostgreSQL mode fallback)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/pattakeludb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway (disabled for local H2 fallback, enabled in PostgreSQL prod)
spring.flyway.enabled=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.pattakelu=DEBUG
logging.level.org.springframework.security=INFO
