# Server Configuration
server.port=${PORT:10000}
server.servlet.context-path=/

# Spring Application
spring.application.name=pattakelu-backend

# Primary Datasource (Supabase PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?user=postgres.lcnjkthvgozgthclqqav&password=Bharath-1306&sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.lcnjkthvgozgthclqqav}
spring.datasource.password=${DATABASE_PASSWORD:Bharath-1306}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Application Security & JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:2592000000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:2592000000}

# Storage Configuration
app.storage.type=${STORAGE_TYPE:supabase}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}

# Supabase Integration
app.supabase.url=${SUPABASE_URL}
app.supabase.anon-key=${SUPABASE_ANON_KEY}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Spring Boot Actuator Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=INFO
logging.level.com.pattakelu=INFO
logging.level.org.springframework.security=INFO
