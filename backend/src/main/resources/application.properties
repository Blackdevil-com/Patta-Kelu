# Server Configuration
server.port=8081
server.servlet.context-path=/

# Spring Application
spring.application.name=pattakelu-backend

# Primary Datasource (H2 with AUTO_SERVER=TRUE and PostgreSQL mode)
spring.datasource.url=jdbc:h2:file:./data/pattakeludb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Application Security & JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Storage Configuration
app.storage.type=local
app.storage.local-dir=./uploads

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Spring Boot Actuator Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=INFO
logging.level.com.pattakelu=INFO
logging.level.org.springframework.security=INFO
